jtex: v1
title: Curvenote SPA Preview Theme
description: A proxy friendly theme server for local previews of Curvenote articles based on a React SPA
version: 0.2.0
license: Restricted. See LICENSE for details.
source: https://github.com/curvenote/next-theme
authors:
  - name: Curvenote
    website: https://curvenote.com
    affiliations:
      - Curvenote
tags:
  - preview
  - development
options:
  - type: string
    id: base_path
    description: >-
      URL path prefix for the theme (e.g. /proxy/3000). Injected as window.__BASE_PATH__
      so assets and API calls work behind a proxy. Leave empty when not behind a prefix.
  - type: string
    id: site_id
    description: Site identifier for this deployment (e.g. for analytics or feature flags).
build:
  install: bun install --production
  start: bun run start
files:
  - client/**/*
  - server/**/*
  - package.json
  - bun.lock
  - LICENSE
  - README.md
